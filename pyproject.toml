[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gold-forecasting"
version = "1.1.0"
description = "GoldPulse: local Indian gold intelligence (INR per 10g international parity)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vishaal Chandrasekar" }]
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "duckdb>=1.0",
  "pyarrow>=14.0",
  "yfinance>=0.2.40",
  "requests>=2.31",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "rich>=13.7",
  "textual>=0.79",
  "statsmodels>=0.14",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "lightgbm>=4.3",
  "mlflow>=2.12",
  "joblib>=1.3",
  "holidays>=0.45",
  "python-dateutil>=2.9",
  "matplotlib>=3.8",
  "plotext>=5.2",
  "tenacity>=8.2",
]

[project.optional-dependencies]
deep = ["torch>=2.2"]
ui = ["streamlit>=1.36"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
gold = "gold.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gold = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
